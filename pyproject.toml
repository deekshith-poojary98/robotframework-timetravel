[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robotframework-timetravel"
version = "0.1.0"
description = "A Robot Framework library for deterministic time travel in tests."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    {name = "Deekshith Poojary", email = "deekshithpoojary355@gmail.com"}
]
keywords = [
    "robotframework",
    "testing",
    "time",
    "time-machine",
    "freeze",
    "timetravel",
    "automation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Robot Framework",
    "Framework :: Robot Framework :: Library",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "robotframework>=7.5",
    "robotframework-pythonlibcore>=4.3.0",
    "time-machine>=2.13.0",
    "markdown>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "black>=24.0.0",
    "mypy>=1.8.0",
    "ruff>=0.6.0",
    "types-setuptools",
    "build>=1.0.0",
]

[project.urls]
Repository = "https://github.com/deekshith-poojary98/robotframework-timetravel"
"Bug Tracker" = "https://github.com/deekshith-poojary98/robotframework-timetravel/issues"
Documentation = "https://deekshith-poojary98.github.io/robotframework-timetravel/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
TimeTravel = ["py.typed"]

[tool.black]
line-length = 88
target-version = ["py311", "py312", "py313"]
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
mypy_path = "src"
packages = ["TimeTravel"]

[[tool.mypy.overrides]]
module = "robotlibcore"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["src"]
filterwarnings = [
    "ignore:cannot collect test class 'Test'.*:pytest.PytestCollectionWarning",
]
